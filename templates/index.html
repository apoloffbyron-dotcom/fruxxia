<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="pyla-ui-token" content="{{ ui_api_token }}">
    <title>FruxX AI</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='images/fruxx-sk.svg') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/tailwind.css') }}">
    <style>
        :root { --font: Arial, Helvetica, sans-serif; }
        .brand { gap: 12px; }
        .brand-mark { width: 48px; height: 48px; flex: 0 0 auto; }
        .brand-title { color: var(--text-primary); }
        .brand-title span { color: var(--text-primary); }
        .sidebar-footer { padding-top: 14px; }
    </style>
</head>
<body>
    <div id="vfx-bg"></div>
    <div class="app-layout">
        <aside id="appSidebar" class="sidebar" aria-label="Primary navigation">
            <div class="brand">
                <img class="brand-mark" src="{{ url_for('static', filename='images/fruxx-sk.svg') }}" alt="SK">
                <div class="brand-copy"><h1 class="brand-title">FruxX <span>AI</span></h1></div>
                <button id="sidebarClose" class="sidebar-close" type="button" aria-label="Close navigation menu">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <nav class="nav-menu"></nav>
            <div class="sidebar-footer">
                <div id="sidebarVersion" class="sidebar-version">FruxX AI</div>
            </div>
        </aside>
        <button id="sidebarBackdrop" class="sidebar-backdrop" type="button" aria-label="Close navigation menu" tabindex="-1"></button>

        <main class="main-content">
            <header class="topbar">
                <div class="topbar-title">
                    <button id="menuToggle" class="menu-toggle" type="button" aria-label="Open navigation menu" aria-controls="appSidebar" aria-expanded="false">
                        <span aria-hidden="true"></span>
                        <span aria-hidden="true"></span>
                        <span aria-hidden="true"></span>
                    </button>
                    <h2 id="pageTitle" class="page-title">Dashboard</h2>
                </div>
                <div class="header-actions">
                    <label class="language-selector" title="Choose interface language" data-i18n-skip>
                        <select id="languageSelect" aria-label="Choose interface language">
                            <option value="en" lang="en">EN</option>
                            <option value="ru" lang="ru">RU</option>
                            <option value="ko" lang="ko">KO</option>
                            <option value="fr" lang="fr">FR</option>
                            <option value="es" lang="es">ES</option>
                        </select>
                    </label>
                </div>
            </header>
            <div id="alertStack" class="alerts-container"></div>
            <div class="views-scroll-shell">
                <div id="viewsWrapper" class="views-wrapper">
                    <section id="view-dashboard" class="view active"></section>
                    <section id="view-queue" class="view"></section>
                    <section id="view-playstyles" class="view"></section>
                    <section id="view-history" class="view"></section>
                    <section id="view-logs" class="view"></section>
                    <section id="view-settings" class="view"></section>
                </div>
                <div id="mainViewScrollbar" class="app-scrollbar main-view-scrollbar" role="scrollbar" aria-controls="viewsWrapper" aria-orientation="vertical" aria-label="Scroll current page" tabindex="0">
                    <div id="mainViewScrollbarThumb" class="app-scrollbar-thumb"></div>
                </div>
            </div>
            <div id="queueDock" class="queue-dock hidden"></div>
        </main>
    </div>
    <div id="tooltip" class="tooltip hidden"></div>
    <div id="toast" class="toast hidden"></div>

    <script>
        (() => {
            const brandText = value => String(value).replace(/Pyla\s*AI|PylaAI|Pyla/gi, "FruxX AI");
            const updateText = node => {
                if (node.nodeType === Node.TEXT_NODE) {
                    const replacement = brandText(node.nodeValue);
                    if (replacement !== node.nodeValue) node.nodeValue = replacement;
                    return;
                }
                if (node.nodeType !== Node.ELEMENT_NODE || ["SCRIPT", "STYLE"].includes(node.tagName)) return;
                for (const attr of ["title", "aria-label", "alt", "placeholder"]) {
                    if (node.hasAttribute(attr)) {
                        const value = brandText(node.getAttribute(attr));
                        if (value !== node.getAttribute(attr)) node.setAttribute(attr, value);
                    }
                }
                node.childNodes.forEach(updateText);
            };
            const scrub = () => {
                document.querySelectorAll("#tipsBand, .tips-band, #announcementModal, #premiumFeatureModal").forEach(node => node.remove());
                document.querySelectorAll("a[href]").forEach(anchor => {
                    const href = anchor.getAttribute("href") || "";
                    if (/^(https?:)?\/\//i.test(href) || /^(mailto|tel):/i.test(href)) anchor.remove();
                });
                updateText(document.body);
                document.title = "FruxX AI";
            };
            scrub();
            new MutationObserver(scrub).observe(document.body, { childList: true, subtree: true, characterData: true });
        })();
    </script>
    <script src="{{ url_for('static', filename='js/i18n_es_ko.js') }}"></script>
    <script src="{{ url_for('static', filename='js/i18n.js') }}"></script>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
